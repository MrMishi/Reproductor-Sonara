<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonora - Music Player</title>
    <meta name="description" content="Sonora es un reproductor de música Hi-Fi local y offline con escaneo nativo ultrarrápido (/Music, /Download, /YMusic), controles de MediaSession para MIUI/HyperOS, ecualizador gráfico y letras sincronizadas." />
    <meta property="og:title" content="Sonora - Music Player" />
    <meta property="og:description" content="Sonora es un reproductor de música Hi-Fi local y offline con escaneo nativo ultrarrápido (/Music, /Download, /YMusic), controles de MediaSession para MIUI/HyperOS, ecualizador gráfico y letras sincronizadas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonora" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0915] text-white selection:bg-purple-600 selection:text-white antialiased overflow-x-hidden min-h-screen w-full">
    <div id="root" class="w-full min-h-screen flex flex-col">
      <!-- Pantalla de inicio visual inmediata para evitar ventana en negro mientras se cargan los módulos -->
      <div id="sonora-initial-splash" class="w-full min-h-screen flex flex-col items-center justify-center p-6 bg-[#0A0915] text-white select-none">
        <div class="relative flex items-center justify-center mb-6">
          <div class="absolute w-20 h-20 bg-purple-600/30 rounded-full blur-xl animate-pulse"></div>
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-700 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-600/40 relative border border-white/20">
            <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
          </div>
        </div>
        <div class="text-xl font-bold tracking-tight text-white mb-1">Sonora Music</div>
        <div id="sonora-splash-status" class="text-xs text-neutral-400 font-medium">Iniciando reproductor...</div>
      </div>
    </div>
    <script>
      // Watchdog de inicio: si los scripts no se cargan o fallan, mostrar mensaje de diagnóstico en lugar de pantalla negra
      (function() {
        var timeout = setTimeout(function() {
          var splash = document.getElementById('sonora-initial-splash');
          var status = document.getElementById('sonora-splash-status');
          if (splash && status) {
            status.innerHTML = '<span style="color:#f87171;">La inicialización tardó demasiado.</span><br/><button onclick="location.reload()" style="margin-top:12px;background:#7c3aed;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;">Reintentar</button>';
          }
        }, 6000);

        window.addEventListener('error', function(e) {
          console.error('[Sonora Startup Error]', e);
        });

        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.log('SW registration skipped:', err);
            });
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
