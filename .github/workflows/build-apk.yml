name: Sonora - Compilar APK Nativa Android

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Compilar APK con Capacitor y Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias de Node
        run: |
          npm ci || npm install

      - name: Compilar aplicación web (Vite Build)
        run: |
          npm run build

      - name: Sincronizar plataforma nativa Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: Compilar APK ejecutable (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Localizar y renombrar APK compilado
        run: |
          echo "Buscando APK generado..."
          ls -la android/app/build/outputs/apk/debug/
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/*.apk build-artifacts/Sonora-MusicPlayer-debug.apk

      - name: Subir APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-Debug-APK
          path: build-artifacts/Sonora-MusicPlayer-debug.apk
          retention-days: 30
