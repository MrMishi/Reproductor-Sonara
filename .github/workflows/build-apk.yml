name: Sonora - Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalación limpia de dependencias
        run: npm ci || npm install

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar plataforma nativa Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Aceptar licencias del SDK de Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Dar permisos y compilar APK Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
