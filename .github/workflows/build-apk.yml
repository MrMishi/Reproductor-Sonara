name: Sonora - Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm ci || npm install

      - name: Compilar aplicación web
        run: |
          npm run build

      - name: Sincronizar plataforma nativa Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Otorgar permisos a Gradle y compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

